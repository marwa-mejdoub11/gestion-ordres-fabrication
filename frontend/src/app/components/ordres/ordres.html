<div class="container mt-4">
  <h2>Gestion des Ordres de Fabrication</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5>{{ editMode ? 'Modifier' : 'Créer' }} un ordre</h5>
      <div class="row g-2">
        <div class="col-md-2">
          <input [(ngModel)]="newOrdre.projet" class="form-control" placeholder="Projet">
        </div>
        <div class="col-md-2">
          <select [(ngModel)]="selectedProduitId" class="form-select">
            <option [value]="null">-- Produit --</option>
            <option *ngFor="let p of produits" [value]="p.id">{{ p.nom }}</option>
          </select>
        </div>
        <div class="col-md-2">
          <input [(ngModel)]="newOrdre.quantite" type="number" class="form-control" placeholder="Quantité">
        </div>
        <div class="col-md-2">
          <input [(ngModel)]="newOrdre.date" type="date" class="form-control">
        </div>
        <div class="col-md-2">
          <select [(ngModel)]="newOrdre.etat" class="form-select">
            <option value="EN_ATTENTE">En attente</option>
            <option value="EN_COURS">En cours</option>
            <option value="TERMINE">Terminé</option>
            <option value="ANNULE">Annulé</option>
          </select>
        </div>
        <div class="col-md-1">
          <button class="btn btn-primary w-100" (click)="save()">
            {{ editMode ? 'Modifier' : 'Créer' }}
          </button>
        </div>
      </div>
      <button *ngIf="editMode" class="btn btn-secondary mt-2" (click)="reset()">Annuler</button>
    </div>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Projet</th>
        <th>Produit</th>
        <th>Quantité</th>
        <th>Date</th>
        <th>État</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of ordres">
        <td>{{ o.id }}</td>
        <td>{{ o.projet }}</td>
        <td>{{ o.produit?.id }}</td>
        <td>{{ o.quantite }}</td>
        <td>{{ o.date }}</td>
        <td>
          <span class="badge"
            [class.bg-warning]="o.etat === 'EN_ATTENTE'"
            [class.bg-primary]="o.etat === 'EN_COURS'"
            [class.bg-success]="o.etat === 'TERMINE'"
            [class.bg-danger]="o.etat === 'ANNULE'">
            {{ o.etat }}
          </span>
        </td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="edit(o)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="delete(o.id!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
