<div class="container mt-4">
  <h2>Gestion des Machines</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5>{{ editMode ? 'Modifier' : 'Ajouter' }} une machine</h5>
      <div class="row g-2">
        <div class="col-md-3">
          <input [(ngModel)]="newMachine.nom" class="form-control" placeholder="Nom">
        </div>
        <div class="col-md-3">
          <select [(ngModel)]="newMachine.etat" class="form-select">
            <option value="">-- État --</option>
            <option value="DISPONIBLE">Disponible</option>
            <option value="EN_PANNE">En panne</option>
            <option value="EN_MAINTENANCE">En maintenance</option>
          </select>
        </div>
        <div class="col-md-3">
          <input [(ngModel)]="newMachine.derniereMaintenance" type="date" class="form-control">
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" (click)="save()">
            {{ editMode ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </div>
      <button *ngIf="editMode" class="btn btn-secondary mt-2" (click)="reset()">Annuler</button>
    </div>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>État</th>
        <th>Dernière maintenance</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of machines">
        <td>{{ m.id }}</td>
        <td>{{ m.nom }}</td>
        <td>
          <span class="badge"
            [class.bg-success]="m.etat === 'DISPONIBLE'"
            [class.bg-danger]="m.etat === 'EN_PANNE'"
            [class.bg-warning]="m.etat === 'EN_MAINTENANCE'">
            {{ m.etat }}
          </span>
        </td>
        <td>{{ m.derniereMaintenance }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="edit(m)">Modifier</button>
          <button class="btn btn-danger btn-sm" 
  (click)="confirmDelete(m.id!)">
  Supprimer
</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
