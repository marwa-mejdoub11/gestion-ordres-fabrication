<div class="container mt-4">
  <h2>Gestion des Produits</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5>{{ editMode ? 'Modifier' : 'Ajouter' }} un produit</h5>
      <div class="row g-2">
        <div class="col-md-3">
          <input [(ngModel)]="newProduit.nom" class="form-control" placeholder="Nom">
        </div>
        <div class="col-md-3">
          <input [(ngModel)]="newProduit.type" class="form-control" placeholder="Type">
        </div>
        <div class="col-md-2">
          <input [(ngModel)]="newProduit.stock" type="number" class="form-control" placeholder="Stock">
        </div>
        <div class="col-md-3">
          <input [(ngModel)]="newProduit.fournisseur" class="form-control" placeholder="Fournisseur">
        </div>
        <div class="col-md-1">
          <button class="btn btn-primary w-100" (click)="save()">
            {{ editMode ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </div>
      <button *ngIf="editMode" class="btn btn-secondary mt-2" (click)="reset()">Annuler</button>
    </div>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Type</th>
        <th>Stock</th>
        <th>Fournisseur</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of produits">
        <td>{{ p.id }}</td>
        <td>{{ p.nom }}</td>
        <td>{{ p.type }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.fournisseur }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="edit(p)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="confirmDelete(p.id!)" *ngIf="p.id">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
