<div class="container mt-4">
  <h2>Gestion des Employés</h2>

  <div class="card mb-4">
    <div class="card-body">
      <h5>{{ editMode ? 'Modifier' : 'Ajouter' }} un employé</h5>
      <div class="row g-2">
        <div class="col-md-3">
          <input [(ngModel)]="newEmploye.nom" class="form-control" placeholder="Nom">
        </div>
        <div class="col-md-3">
          <input [(ngModel)]="newEmploye.poste" class="form-control" placeholder="Poste">
        </div>
        <div class="col-md-3">
          <select [(ngModel)]="selectedMachineId" class="form-select">
            <option [value]="null">-- Machine assignée --</option>
            <option *ngFor="let m of machines" [value]="m.id">{{ m.nom }}</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" (click)="save()">
            {{ editMode ? 'Modifier' : 'Ajouter' }}
          </button>
        </div>
      </div>
      <button *ngIf="editMode" class="btn btn-secondary mt-2" (click)="reset()">Annuler</button>
    </div>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Poste</th>
        <th>Machine assignée</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of employes">
        <td>{{ e.id }}</td>
        <td>{{ e.nom }}</td>
        <td>{{ e.poste }}</td>
        <td>{{ e.machineAssignee?.id || 'Aucune' }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="edit(e)">Modifier</button>
          <button class="btn btn-danger btn-sm" 
  (click)="confirmDelete(e.id!)">
  Supprimer
</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
